[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-receipt-extractor"
dynamic = ["version"]
description = "Automated Brazilian bank receipt data extraction (PIX, TED, DOC) using Agno and Groq"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
  { name = "Jady", email = "jady@example.com" },
]
classifiers = [
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
]
dependencies = [
  "agno>=0.5.0",
  "groq>=0.3.0",
  "pdf2image>=1.17.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["bank_receipt_extractor"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[project.urls]
Homepage = "https://github.com/anomalyco/receipt-extractor"
Repository = "https://github.com/anomalyco/receipt-extractor"
Issues = "https://github.com/anomalyco/receipt-extractor/issues"

[tool.hatch.version]
path = "bank_receipt_extractor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bank_receipt_extractor"]
