[project]
name = "receipt-extractor"
version = "0.1.0"
description = "Automated Brazilian bank receipt data extraction (PIX, TED, DOC) using Agno and Groq"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=0.5.0",
    "groq>=0.3.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]
